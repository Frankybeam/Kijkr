name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to **Kijkr**! Thanks for opening your first issue in this repository.
            
            - Please ensure all logs and firmware / system context are included.
            - Say which source type you use (M3U, Xtream Codes or Stalker), but never post your portal address, MAC, user name or password.
          pr-message: |
            🎉 Welcome and thank you for your contribution to **Kijkr**!
            
            - Our automated build workflows will run validation checks on this pull request shortly.
            - Please make sure changes adhere to project standards and have been tested against PS5 homebrew toolchains where possible.
